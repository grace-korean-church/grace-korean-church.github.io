<!-- Site Navigation Schema for Sitelinks -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": [
    {
      "@type": "SiteNavigationElement",
      "position": 1,
      "name": "교회 소개",
      "description": "{{ site.church.name }}의 비전과 섬기는 이들을 소개합니다",
      "url": "{{ site.url }}{{ site.baseurl }}/about/"
    },
    {
      "@type": "SiteNavigationElement",
      "position": 2,
      "name": "예배 안내",
      "description": "주일예배 오전 10시 30분, 수요 성경공부, 금요 기도회 시간 안내",
      "url": "{{ site.url }}{{ site.baseurl }}/services/"
    },
    {
      "@type": "SiteNavigationElement",
      "position": 3,
      "name": "찾아오시는 길",
      "description": "{{ site.church.name }} 위치, 지도 안내",
      "url": "{{ site.url }}{{ site.baseurl }}/visit/"
    },
    {
      "@type": "SiteNavigationElement",
      "position": 4,
      "name": "소식",
      "description": "교회 소식, 행사 안내",
      "url": "{{ site.url }}{{ site.baseurl }}/news/"
    },
    {
      "@type": "SiteNavigationElement",
      "position": 5,
      "name": "Welcome",
      "description": "Location, directions, and contact information in English, with a link to check current service times",
      "url": "{{ site.url }}{{ site.baseurl }}/en/"
    }
  ]
}
</script>

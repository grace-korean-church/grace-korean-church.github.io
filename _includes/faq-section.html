{%- comment -%}
  화면에 보이는 자주 묻는 질문. include 인자 lang(ko|en). 내용은 _data/faq.yml.
  접지 않고 항상 펼쳐 둔다. 접힌 답은 검색·AI 답변 엔진이 덜 신뢰한다.
{%- endcomment -%}
{%- assign faq = site.data.faq[include.lang] -%}
<section class="section-fullwidth section-white faq-section" id="faq">
  <div class="container">
    <h2 class="text-center">{{ faq.title }}</h2>
    <div class="faq-list">
      {%- for item in faq.items %}
      <div class="faq-item">
        <h3 class="faq-question">{{ item.q }}</h3>
        <p class="faq-answer">{{ item.a }}</p>
      </div>
      {%- endfor %}
    </div>
  </div>
</section>

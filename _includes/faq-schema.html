<!-- FAQ Structured Data (JSON-LD) -->

     검색 결과에 잘못된 시간이 표시된다. -->
<script type="application/ld+json">

      }

    {

      }
    },
    {

      }
    },
    {
      "@type": "Question",
      "name": "예배는 한국어로 드리나요?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "주일 예배는 한국어로 드리며 영어 통역이 함께 제공됩니다. 영어권 성도를 위한 영어 성경공부 모임이 수요일 오전 10시에 따로 있습니다."
      }
    },
    {
      "@type": "Question",
      "name": "{{ site.church.name }}는 어느 교단 소속인가요?",

        "text": "{{ site.church.name }}는 하나님의성회(Assemblies of God) 소속이며, 1982년 8월 15일에 설립되었습니다."
      }
    }
  ]
}
</script>

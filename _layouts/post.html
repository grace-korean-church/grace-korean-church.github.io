---
layout: default
---

<!-- 소식 글 구조화 데이터: 게시일·수정일을 검색 엔진에 전달한다 -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.summary | default: page.excerpt | strip_html | strip | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "inLanguage": "ko",
  "mainEntityOfPage": "{{ page.url | absolute_url }}",
  "author": { "@id": "{{ site.url }}{{ site.baseurl }}/#church" },
  "publisher": { "@id": "{{ site.url }}{{ site.baseurl }}/#church" },
  "image": "{{ page.image | default: '/assets/images/og-image.jpg' | absolute_url }}"
}
</script>

<div class="container post-container">
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>

      <div class="post-meta">
        <span class="post-date">{{ page.date | date: "%Y년 %m월 %d일" }}</span>
        {% if page.category %}
        <span class="post-category">{{ page.category }}</span>
        {% endif %}
      </div>

      {% if page.summary %}
      <p class="post-summary">{{ page.summary }}</p>
      {% endif %}
    </header>

    <div class="post-content">
      {{ content }}
    </div>

    {% if page.tags %}
    <footer class="post-footer">
      <div class="post-tags">
        {% for tag in page.tags %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
    </footer>
    {% endif %}
  </article>

  <div class="post-navigation">
    <a href="{{ '/news/' | relative_url }}" class="btn btn-ghost">← 목록으로 돌아가기</a>
  </div>
</div>

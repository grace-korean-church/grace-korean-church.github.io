# Site settings
title: "은혜한인교회 (Grace Korean Church)"
description: "사랑하며 섬기며 복음을 전하는 교회. 미국 일리노이주 몰린(Quad Cities)의 한인 교회, 1982년 설립"
url: "https://grace-korean-church.github.io"
baseurl: ""
pastor: "오기윤 목사"
pastor_en: "Rev. Ki Yoon Oh"
# 주보 표기: Est. Aug. 15th, 1982
established: "1982-08-15"
established_year: 1982

# 교단 (주보 로고·명칭 표기 기준)
denomination: "하나님의성회"
denomination_en: "Assemblies of God"

# 교회 표어
motto: "사랑하며 섬기며 복음을 전하는 교회"
motto_en: "A church that loves, serves, and proclaims the gospel"

# SEO settings
author: "은혜한인교회"
keywords: "은혜한인교회, Grace Korean Church, 몰린 한인교회, Moline 한인교회, Quad Cities 한인교회, 일리노이 한인교회, 미주 한인교회, 한인 예배, 주일예배"
locale: "ko_KR"
lang: "ko"

# Church information
church:
  name: "은혜한인교회"
  name_en: "Grace Korean Church"
  # 번지수는 교회 간판 표기(4815)를 따른다. 구글 지도 등록 정보는 4915로
  # 되어 있어 서로 어긋나지만, 간판이 교회 자신의 표기다.
  # 지도 임베드는 번지수 대신 교회 이름으로 조회하므로, 둘 중 어느 쪽이
  # 틀렸든 방문자가 엉뚱한 건물로 가지 않는다.
  address: "4815 21st Ave A, Moline, IL 61265, USA"
  address_locality: "Moline"
  address_region: "IL"
  postal_code: "61265"
  address_country: "US"
  map_url: "https://maps.app.goo.gl/eXbKCooB82qSZeou7"
  # TODO: 몰린 시 기준 근사 좌표. 교회 건물 정확한 좌표로 교체할 것
  latitude: "41.5067"
  longitude: "-90.5151"
  phone: "309-764-3550"
  mobile: "309-206-3500"
  email: "gkc.moline@gmail.com"

# Social media
social:
  facebook: "https://www.facebook.com/GKC.Moline/"
  instagram: ""
  youtube: "https://www.youtube.com/@gracekoreanchurchassemblyo5929"

# Analytics
# 비워두면 추적 스크립트를 아예 출력하지 않는다.
# GA4 속성을 만들면 측정 ID(G-XXXXXXXXXX)를 여기 넣기만 하면 동작한다.
google_analytics: ""

# Build settings
markdown: kramdown
timezone: America/Chicago
permalink: /news/:year/:month/:day/:title/
future: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "ko"
  - scope:
      path: ""
      type: "pages"
    values:
      lang: "ko"
  - scope:
      path: "en"
      type: "pages"
    values:
      lang: "en"

# Exclude from build
exclude:
  # _source/는 이미지 원본 보관용. 절대 빌드에 포함하지 않는다.
  - _source
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - script
  - vendor
